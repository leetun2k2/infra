server {
  listen 80;
  listen 3000;
  # listen 443 ssl;
  server_name admin.anlew.local localhost;

  # ssl_certificate     /etc/nginx/ssl/abc.com/fullchain.pem;
  # ssl_certificate_key /etc/nginx/ssl/abc.com/privkey.pem;

  include /etc/nginx/snippets/common.conf;
  include /etc/nginx/snippets/gateway.conf;

  location = /auth/google/callback {
    access_log off;
    proxy_intercept_errors off;
    proxy_pass http://go_auth/api/auth/v1/callback/google;
  }

  location = /api/auth/v1/callback/google {
    access_log off;
    proxy_intercept_errors off;
    proxy_pass http://go_auth/api/auth/v1/callback/google;
  }

  location /api/auth/v1/ {
    proxy_intercept_errors off;
    proxy_pass http://web_admin_auth/api/auth/v1/;
  }

  location /api/admin/v1/ {
    proxy_intercept_errors off;
    proxy_pass http://web_admin_auth/api/admin/v1/;
  }

  location = /auth/callback {
    access_log off;
    proxy_intercept_errors off;
    proxy_pass http://web_admin_auth/auth/callback;
  }

  location / {
    proxy_pass http://web_admin;
  }
}
