server {
  listen 80;
  # listen 443 ssl;
  server_name redis.anlew.local;

  # ssl_certificate     /etc/nginx/ssl/abc.com/fullchain.pem;
  # ssl_certificate_key /etc/nginx/ssl/abc.com/privkey.pem;

  include /etc/nginx/snippets/common.conf;

  location / {
    resolver 127.0.0.11 valid=30s;
    set $upstream_redis "http://devops-redisinsight:5540";
    proxy_pass $upstream_redis;
  }
}
