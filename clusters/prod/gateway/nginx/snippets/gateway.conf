limit_req zone=gateway_limit burst=100 nodelay;

location /api/health {
  return 200 "OK";
}

location /api/auth/ {
  proxy_intercept_errors off;
  proxy_pass http://go_auth/api/auth/;
}

location /api/product/ {
  proxy_intercept_errors off;
  proxy_pass http://go_product/api/product/;
}

location /api/catalog/ {
  proxy_intercept_errors off;
  proxy_pass http://go_product/api/catalog/;
}

location /api/payment/ {
  proxy_intercept_errors off;
  proxy_pass http://go_payment/api/payment/;
}
