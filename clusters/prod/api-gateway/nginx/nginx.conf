events {}

http {
  limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=50r/s;
  limit_req_status 429;

  server_tokens off;

  gzip on;
  gzip_types text/plain text/html application/json application/javascript text/css application/xml;
  gzip_min_length 256;

  access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

  client_max_body_size 10m;

  include /etc/nginx/snippets/upstreams.conf;
  include /etc/nginx/conf.d/*.conf;
}
