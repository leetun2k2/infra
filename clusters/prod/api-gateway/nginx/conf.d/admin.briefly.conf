server {
  listen 80;
  # listen 443 ssl;
  server_name admin.briefly.com;

  # ssl_certificate     /etc/nginx/ssl/abc.com/fullchain.pem;
  # ssl_certificate_key /etc/nginx/ssl/abc.com/privkey.pem;

  include /etc/nginx/snippets/common.conf;
  include /etc/nginx/snippets/api-gateway.conf;

  location / {
    root /usr/share/nginx/html/admin.briefly;
    try_files $uri $uri/ /index.html;
  }
}
