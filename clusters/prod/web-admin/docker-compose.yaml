services:
  web-admin:
    image: web-admin:latest
    container_name: web-admin
    restart: unless-stopped
    networks:
      - global

  web-admin-auth:
    image: web-admin-auth:latest
    container_name: web-admin-auth
    restart: unless-stopped
    env_file:
      - ./web-admin-auth/.env
    networks:
      - global

networks:
  global:
    driver: bridge
    external: true
